local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Deployed environments select this service when GCS_BUCKET is set.
# Local Docker and tests stay on Disk. Signed URLs use the Cloud Run
# service account (iam: true); do not put a JSON key in the environment.
google:
  service: GCS
  project: <%= ENV["GCS_PROJECT_ID"] %>
  bucket: <%= ENV["GCS_BUCKET"] %>
  iam: true
  gsa_email: <%= ENV["GCS_SERVICE_ACCOUNT_EMAIL"] %>
  public: false
