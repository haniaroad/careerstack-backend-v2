name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-east5
      PROJECT_ID: careerstack-staging
      SERVICE: careerstack-api
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/careerstack-api/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run services update "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --image="${{ env.IMAGE }}" \
            --port=3000 \
            --quiet

      - name: Smoke check health
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" --format='value(status.url)')
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/health" | grep -q ok; then
              echo "Health check passed: $URL/health"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
