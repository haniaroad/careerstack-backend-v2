openapi: 3.0.3
info:
  title: CareerStack API
  version: 0.4.0
  description: |
    Platform foundation plus identity, onboarding, and workspace contracts.

    Authentication: every endpoint except `/health`, `/ready`, `/up`,
    `/api/v1/stripe/webhooks`, and `/api/v1/public/*` requires a verified
    Firebase ID token in `Authorization: Bearer <token>`. The Stripe webhook
    is signature-verified instead. Public project and profile GETs enforce
    server-side eligibility and return 404 (never 403) when ineligible.
    The first verified token for an email bootstraps a CareerStack
    account in `pending_onboarding`. Locally and in CI, `FIREBASE_AUTH_STUB=true`
    accepts `Bearer test:<firebase_uid>:<email>` instead.

    Privacy: full date of birth is accepted only by
    `POST /api/v1/onboarding/organization_invited`. It is never returned by any
    endpoint; only the derived `age_status` is exposed.
servers:
  - url: http://localhost:3000
    description: Local Compose
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness health check
      tags: [Platform]
      security: []
      responses:
        "200":
          description: Process is accepting requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      operationId: getReady
      summary: Readiness check including database connectivity
      tags: [Platform]
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Dependencies are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyStatus"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Current authenticated session
      description: |
        Returns the account, profile, workspace grants, active workspace,
        organization admin access, program filter, and age visibility flags. The
        first call for a newly verified email creates the account.
      tags: [Session]
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List the caller's in-app notifications
      description: |
        Returns the authenticated user's notification rows (newest unread first).
        Staff-only email rows with no recipient user are never listed. The header
        bell uses this list; Inbox remains a separate operational queue.
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/notifications/unread_count:
    get:
      operationId: getNotificationUnreadCount
      summary: Unread in-app notification count
      tags: [Notifications]
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/notifications/read_all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all of the caller's unread notifications as read
      tags: [Notifications]
      responses:
        "200":
          description: Unread count after marking
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one of the caller's notifications as read
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                required: [notification]
                properties:
                  notification:
                    $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/notification_preferences:
    get:
      operationId: getNotificationPreferences
      summary: Email preference categories for the caller
      tags: [Notifications]
      responses:
        "200":
          description: Preference categories
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: updateNotificationPreferences
      summary: Update email preference categories
      description: Mandatory account categories cannot be disabled.
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        enum: [account, project_activity, reminders]
                      email_enabled:
                        type: boolean
                      digest_cadence:
                        type: string
                        enum: [realtime, daily, weekly, off]
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/onboarding/independent:
    post:
      operationId: completeIndependentOnboarding
      summary: Complete independent adult onboarding
      description: |
        Requires age self-attestation (18+) and terms acceptance plus the minimum
        profile. On success the account becomes `active` with `age_status: adult`,
        receives a Personal workspace, and receives one personal trial credit.
        Retrying returns `already_onboarded` and grants nothing further.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndependentOnboardingRequest"
      responses:
        "201":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/onboarding/organization_invited:
    post:
      operationId: completeOrganizationInvitedOnboarding
      summary: Complete organization-invited onboarding
      description: |
        Requires a usable invitation token, terms acceptance, full date of birth,
        and the minimum profile. Date of birth is stored server-side and reduced
        to `age_status` using the organization's timezone; it is never returned.
        Adults additionally receive a Personal workspace and one personal trial
        credit. Minors and unknown-age users receive neither.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitedOnboardingRequest"
      responses:
        "201":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Validation failed. `error.code` is one of `validation_error`,
            `already_onboarded`, `invalid_invitation`, or `below_minimum_age`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List the workspaces the caller may use
      description: Personal first when granted, then one workspace per organization membership.
      tags: [Workspaces]
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/switch:
    post:
      operationId: switchWorkspace
      summary: Switch the active workspace
      description: |
        Membership is revalidated server-side on every call. A workspace the
        caller does not belong to is rejected with 403 and the active workspace is
        left unchanged.
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated session with the new active workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/workspaces/program_filter:
    post:
      operationId: setProgramFilter
      summary: Persist the actor's program filter in the active Organization workspace
      description: |
        Programs are filters, not workspaces. `mode=all` clears the filter.
        `mode=program` requires a program in the active organization.
        Hidden for Personal workspaces (session `program_filter` is null).
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [all, program]
                program_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: Updated session including the new program filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization and become its first administrator
      description: |
        Available to verified adults who have completed onboarding. Creates the
        organization and its workspace, makes the caller an `admin`, and grants
        three pooled organization trial credits. The trial is limited to one grant
        per adult ever: a second organization is created with
        `organization_trial_granted: false`. No personal credit is consumed.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Caller is suspended, a minor, or of unknown age
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/organizations/{organization_id}/admin:
    get:
      operationId: getOrganizationAdmin
      summary: Organization administration pulse and upgrade-request summary
      description: |
        Restricted to staff in the active Organization workspace. `organization_id`
        must match that workspace. Participants receive 403. Date of birth is never
        included.
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Admin payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organizations/{organization_id}/programs:
    get:
      operationId: listOrganizationPrograms
      summary: List programs for organization staff
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: object
                required: [programs]
                properties:
                  programs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrganizationProgram
      summary: Create a program (draft or active); does not consume credits
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, active]
      responses:
        "201":
          description: Program created
          content:
            application/json:
              schema:
                type: object
                required: [program]
                properties:
                  program:
                    $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/programs/{id}:
    patch:
      operationId: updateProgram
      summary: Update program name, description, or activate a draft
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, active]
      responses:
        "200":
          description: Program updated
          content:
            application/json:
              schema:
                type: object
                required: [program]
                properties:
                  program:
                    $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteEmptyDraftProgram
      summary: Delete an empty draft program (administrator only)
      description: Blocked when enrollments, projects, or invitations exist.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Draft deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/programs/{id}/archive:
    post:
      operationId: archiveProgram
      summary: Archive a program (administrator only)
      description: Archived programs block new projects, invitations, and edits.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Program archived
          content:
            application/json:
              schema:
                type: object
                required: [program]
                properties:
                  program:
                    $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/organizations/{organization_id}/memberships:
    get:
      operationId: listOrganizationMemberships
      summary: List organization members for staff
      description: |
        Includes role, program associations, and derived `age_status`. Date of
        birth is never returned.
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: q
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, manager, participant]
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organization_memberships/{id}:
    patch:
      operationId: updateOrganizationMembership
      summary: Update membership role and program enrollments
      description: Managers cannot promote to admin or manager.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, manager, participant]
                program_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/OrganizationMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/organization_memberships/{id}/remove:
    post:
      operationId: removeOrganizationMembership
      summary: Remove a member (administrator only)
      description: Blocks last-administrator removal. Account and personal work are retained.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [left_program, completed_program, inactive, policy_violation, other]
      responses:
        "200":
          description: Membership marked removed
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/OrganizationMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/organizations/{organization_id}/invitations:
    get:
      operationId: listOrganizationInvitations
      summary: List invitations for organization staff
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organizations/{organization_id}/upgrade_request:
    get:
      operationId: getUpgradeRequest
      summary: Show the open upgrade request (administrator only)
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Open request or null
          content:
            application/json:
              schema:
                type: object
                required: [upgrade_request]
                properties:
                  upgrade_request:
                    allOf:
                      - $ref: "#/components/schemas/UpgradeRequest"
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: upsertUpgradeRequest
      summary: Create or update the open upgrade request (administrator only)
      description: |
        One open request per organization. Persists a staff-notification intent
        addressed conceptually to hello@careerstack.co. Does not send Mailgun.
        Notes are stored but must not be sent as Mixpanel properties.
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_participants, expected_projects_or_cohorts, timeline]
              properties:
                expected_participants:
                  type: string
                expected_projects_or_cohorts:
                  type: string
                timeline:
                  type: string
                notes:
                  type: string
      responses:
        "200":
          description: Upserted open request
          content:
            application/json:
              schema:
                type: object
                required: [upgrade_request]
                properties:
                  upgrade_request:
                    $ref: "#/components/schemas/UpgradeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/invitations:
    post:
      operationId: createInvitation
      summary: Create an organization invitation
      description: |
        Restricted to organization `admin` and `manager` members. The raw token is
        returned only in this response; the server stores just its SHA-256 digest
        and cannot reproduce it. Inviting never consumes credits.
      tags: [Invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created, including the one-time raw token
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/CreatedInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/invitations/{token}:
    get:
      operationId: getInvitation
      summary: Preview an invitation before accepting it
      description: |
        Unknown, expired, and already-accepted tokens all return the same
        `invalid_invitation` response so tokens cannot be probed.
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/InvitationPreview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInvitation"
  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation as an already-onboarded user
      description: |
        For accounts that have completed onboarding. Accounts still in
        `pending_onboarding` use the organization-invited onboarding endpoint
        instead, which also collects date of birth. An existing membership keeps
        its current role. Accepting never consumes credits.
      tags: [Invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Membership created and session returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`error.code` is `invalid_invitation` or `onboarding_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/taxonomies:
    get:
      operationId: listTaxonomies
      summary: List controlled taxonomies and their terms
      description: |
        Returns `roles`, `experience_levels`, `organization_structures`, and
        `organization_goals`. Term IDs are stable across environments and safe to
        cache. Terms are ordered for display, with any `is_other` term last.
      tags: [Taxonomies]
      responses:
        "200":
          description: Taxonomy catalog
          content:
            application/json:
              schema:
                type: object
                required: [taxonomies]
                properties:
                  taxonomies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Taxonomy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/age_visibility:
    patch:
      operationId: updateAgeVisibility
      summary: Confirm or reverse public identity after aging up
      description: |
        Available to adults only. `confirm` clears the pending visibility review
        and makes public identity visible; `reverse` withdraws it again.
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [confirm, reverse]
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Caller is suspended, a minor, or of unknown age
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
