openapi: 3.0.3
info:
  title: CareerStack API
  version: 0.1.0
  description: Platform foundation contract for health, readiness, and errors.
servers:
  - url: http://localhost:3000
    description: Local Compose
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness health check
      security: []
      responses:
        "200":
          description: Process is accepting requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      operationId: getReady
      summary: Readiness check including database connectivity
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Dependencies are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyStatus"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    NotReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
