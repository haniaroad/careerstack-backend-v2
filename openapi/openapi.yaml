  /api/v1/ai/project_generations:
    post:
      operationId: createProjectGeneration
      summary: Start AI project draft generation via OpenRouter
      description: |
        Enqueues structured draft generation. Does not consume project credits.
        Returns 503 when the kill switch / budget stop is on or the provider is
        unconfigured. At most one successful generation per net-new draft.
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  maxLength: 4000
                constraints:
                  type: object
                  properties:
                    skill_level:
                      type: string
                    time_available:
                      type: string
                client_draft_key:
                  type: string
                  description: Client-stable key for pre-draft allowance binding
                project_id:
                  type: string
                  format: uuid
                  description: Optional existing draft to bind generation to
      responses:
        "202":
          description: Generation accepted
          content:
            application/json:
              schema:
                type: object
                required: [generation]
                properties:
                  generation:
                    $ref: "#/components/schemas/AiGeneration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          description: Abuse rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/ai/project_generations/{id}:
    get:
      operationId: getProjectGeneration
      summary: Poll AI project generation status (owner only)
      tags: [AI]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Generation status
          content:
            application/json:
              schema:
                type: object
                required: [generation]
                properties:
                  generation:
                    $ref: "#/components/schemas/AiGeneration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/project_generations/{id}/accept:
    post:
      operationId: acceptProjectGeneration
      summary: Accept a succeeded generation into a solo project draft
      description: Creates or updates a draft project. Does not consume credits.
      tags: [AI]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                program_id:
                  type: string
                  format: uuid
                  description: Required for organization drafts when the program filter is All programs
      responses:
        "200":
          description: Draft project updated from generation
          content:
            application/json:
              schema:
                type: object
                required: [project, generation]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  generation:
                    $ref: "#/components/schemas/AiGeneration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      description: Raw invitation token as delivered to the invitee.
      schema:
        type: string
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: Must match the caller's active Organization workspace.
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    NotReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code, for example `unauthenticated`,
                `account_suspended`, `forbidden`, `not_found`, `validation_error`,
                `already_onboarded`, `invalid_invitation`, `below_minimum_age`, or
                `onboarding_required`.
            message:
              type: string
            request_id:
              type: string
    AgeStatus:
      type: string
      nullable: true
      enum: [adult, minor, unknown]
      description: |
        Derived from date of birth for organization-invited users and from age
        self-attestation for independent users. Null before onboarding completes.
        Full date of birth is never exposed.
    Workspace:
      type: object
      nullable: true
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, organization]
        name:
          type: string
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: Null for Personal workspaces.
        workspace_status:
          type: string
          nullable: true
          enum: [active, offboarding_readonly, disabled]
          description: Present for Organization workspaces; omitted/null for Personal.
    SessionUser:
      type: object
      required: [id, email, status, onboarding_complete]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending_onboarding, active, suspended]
        age_status:
          $ref: "#/components/schemas/AgeStatus"
        onboarding_path:
          type: string
          nullable: true
          enum: [independent, organization_invited]
        onboarding_complete:
          type: boolean
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        personal_trial_granted:
          type: boolean
        organization_trial_granted:
          type: boolean
        public_identity_visible:
          type: boolean
          description: False for minors, unknown age, and adults pending visibility review.
        timezone:
          type: string
          description: IANA timezone for digest send windows. Default UTC. Never included on public or by-slug profiles.
    SessionProfile:
      type: object
      nullable: true
      description: |
        Minimum profile plus optional fields. Full date of birth is deliberately
        absent from this schema and from every response.
      required: [display_name, country, state_region, career_goal, experience_level]
      properties:
        display_name:
          type: string
        country:
          type: string
        state_region:
          type: string
        career_goal:
          type: string
        current_role_term_id:
          type: string
          format: uuid
          nullable: true
        current_role_other:
          type: string
          nullable: true
