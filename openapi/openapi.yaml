          type: boolean
    OrganizationMembership:
      type: object
      required: [id, organization_id, user_id, email, role, status, age_status]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, participant]
        status:
          type: string
          enum: [active, removed]
        age_status:
          $ref: "#/components/schemas/AgeStatus"
        program_ids:
