        null otherwise. Programs are context rather than workspaces, and the
        filter defaults to all programs.
      required: [mode, available_programs]
      properties:
        mode:
          type: string
          enum: [all, program]
        program_id:
          type: string
          format: uuid
          nullable: true
        available_programs:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string
                enum: [draft, active, archived]
    OrgAdminCapabilities:
      type: object
