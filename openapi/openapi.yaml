          type: string
          enum: [admin, manager, participant]
        program_id:
          type: string
          format: uuid
          nullable: true
        program_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted, expired]
        invited_by_name:
          type: string
          nullable: true
    Session:
      type: object
      required:
        - user
        - profile
        - workspaces
        - active_workspace
        - can_access_org_admin
        - age_visibility
        - program_filter
        - credits
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        profile:
          $ref: "#/components/schemas/SessionProfile"
        workspaces:
          type: array
          description: Personal first when granted, then one per organization membership.
          items:
            $ref: "#/components/schemas/Workspace"
        active_workspace_id:
          type: string
          format: uuid
          nullable: true
        active_workspace:
          $ref: "#/components/schemas/Workspace"
        can_access_org_admin:
          type: boolean
          description: True when the active workspace is an organization the caller administers or manages.
        org_admin_capabilities:
          allOf:
            - $ref: "#/components/schemas/OrgAdminCapabilities"
          nullable: true
          description: Present for staff in an Organization workspace; null otherwise.
        age_visibility:
          $ref: "#/components/schemas/AgeVisibility"
        program_filter:
          $ref: "#/components/schemas/ProgramFilter"
        credits:
          $ref: "#/components/schemas/CreditsSummary"
          nullable: true
    CreditsSummary:
      type: object
      required: [remaining, trial_remaining, purchased_remaining, owner_type]
      properties:
        remaining:
          type: integer
        trial_remaining:
          type: integer
        purchased_remaining:
          type: integer
        owner_type:
          type: string
          enum: [user, organization]
    Project:
      type: object
      required: [id, slug, title, mode, status, visibility, source, workspace_id, creator_id, skills]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [solo, team]
        joining_mode:
          type: string
          enum: [application, instant, invite_only]
          nullable: true
        capacity:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        participant_count:
          type: integer
          nullable: true
        seats_remaining:
          type: integer
          nullable: true
        recruitment_state:
          type: string
          enum: [open, full, closed]
          nullable: true
        status:
          type: string
          enum: [draft, active, completed, expired, cancelled, archived]
        phase:
          type: string
          enum: [normal, ending_soon, grace_period, read_only]
        visibility:
          type: string
          enum: [public, private]
        source:
          type: string
          enum: [manual, ai]
        objective:
          type: string
          nullable: true
        project_type:
          type: string
          nullable: true
        expected_duration:
          type: string
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        final_expires_at:
          type: string
          format: date-time
          nullable: true
        definition_of_done:
          type: string
          nullable: true
        roles_needed:
          type: array
          items:
            type: string
        proposed_tasks:
          type: array
          items:
            type: object
        submission_expectations:
          type: string
          nullable: true
        ai_generation_succeeded_at:
          type: string
          format: date-time
          nullable: true
        workspace_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Required for organization projects; always null for personal projects.
        creator_id:
          type: string
          format: uuid
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        expired_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicProject:
      type: object
      required: [id, slug, title, mode, status, skills, creator, canonical_path, indexable, tasks]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        definition_of_done:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        roles_needed:
          type: array
          items:
            type: string
        project_type:
          type: string
          nullable: true
        mode:
          type: string
          enum: [solo, team]
        status:
          type: string
          enum: [draft, active, completed, expired, cancelled, archived]
        phase:
          type: string
          enum: [normal, ending_soon, grace_period, read_only]
        joining_mode:
          type: string
          enum: [application, instant, invite_only]
          nullable: true
        capacity:
          type: integer
          nullable: true
        seats_remaining:
          type: integer
          nullable: true
        recruitment_state:
          type: string
          enum: [open, full, closed]
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        tasks:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              acceptance_criteria:
                type: string
                nullable: true
        creator:
          type: object
          required: [display_name]
          properties:
            display_name:
              type: string
            profile_slug:
              type: string
              nullable: true
        canonical_path:
          type: string
        indexable:
          type: boolean
    AiGeneration:
      type: object
      required: [id, use_case, status, retryable]
      properties:
        id:
          type: string
          format: uuid
        use_case:
          type: string
          enum: [project_draft_generation]
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        client_draft_key:
          type: string
          nullable: true
        constraints:
          type: object
        result:
          type: object
        project_id:
          type: string
          format: uuid
          nullable: true
        model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        prompt_tokens:
          type: integer
          nullable: true
        completion_tokens:
          type: integer
          nullable: true
        total_tokens:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        retryable:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        succeeded_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreditLedgerEntry:
      type: object
      required: [id, event, reason, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
        reason:
          type: string
        amount:
          type: integer
        related_type:
          type: string
          nullable: true
        related_id:
          type: string
          format: uuid
          nullable: true
        credit_lot_id:
          type: string
          format: uuid
          nullable: true
        lot_source:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    MinimumProfileFields:
      type: object
      description: |
        Minimum profile required before workspace access. Optional fields
        (`bio`, `image_url`, `interests`, `github_url`, `linkedin_url`,
        `portfolio_url`) may all be omitted. Each role accepts either a taxonomy
        term id or, when the Other term is chosen, matching free text.
      required:
        - display_name
        - country
        - state_region
        - career_goal
        - experience_level
      properties:
        display_name:
          type: string
        country:
          type: string
        state_region:
          type: string
        career_goal:
          type: string
        experience_level:
          type: string
          enum: [beginner, intermediate, advanced]
        current_role_term_id:
          type: string
          format: uuid
          description: Must be a term from the `roles` taxonomy.
        current_role_other:
          type: string
          description: Required instead of a term id only when the Other role is selected.
        target_role_term_id:
          type: string
          format: uuid
        target_role_other:
          type: string
        bio:
          type: string
        image_url:
          type: string
        github_url:
          type: string
        linkedin_url:
          type: string
        portfolio_url:
          type: string
        interests:
          type: array
          maxItems: 10
          description: Extra tags beyond the first ten are discarded.
          items:
            type: string
    IndependentOnboardingRequest:
      allOf:
        - $ref: "#/components/schemas/MinimumProfileFields"
        - type: object
          required: [age_attested, terms_accepted]
          properties:
            age_attested:
              type: boolean
              description: Must be true; the user attests to being at least 18.
            terms_accepted:
              type: boolean
              description: Must be true.
    InvitedOnboardingRequest:
      allOf:
        - $ref: "#/components/schemas/MinimumProfileFields"
        - type: object
          required: [invitation_token, terms_accepted, date_of_birth]
          properties:
            invitation_token:
              type: string
            terms_accepted:
              type: boolean
            date_of_birth:
              type: string
              format: date
              description: |
                ISO 8601 (YYYY-MM-DD). Write-only: stored server-side, excluded
                from logs, and never returned by any endpoint. Ages under 13 are
                refused with `below_minimum_age`.
    CreateOrganizationRequest:
      type: object
      description: |
        Structure and primary goal each accept either a taxonomy term id or, when
        the Other term is chosen, matching free text.
      required: [name, country, state_region]
      properties:
        name:
          type: string
        country:
          type: string
        state_region:
          type: string
        structure_term_id:
          type: string
          format: uuid
          description: Must be a term from the `organization_structures` taxonomy.
        structure_other:
          type: string
        primary_goal_term_id:
          type: string
          format: uuid
          description: Must be a term from the `organization_goals` taxonomy.
        primary_goal_other:
          type: string
        website:
          type: string
        logo_url:
          type: string
        expected_participant_range:
          type: string
        timezone:
          type: string
          default: UTC
          description: IANA timezone used for the organization's adult age boundary.
    CreateOrganizationResponse:
      type: object
      required: [organization, organization_trial_granted, session]
      properties:
        organization:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            workspace_id:
              type: string
              format: uuid
              nullable: true
        organization_trial_granted:
          type: boolean
          description: False when this adult already used their one organization trial.
        session:
          $ref: "#/components/schemas/Session"
    CreateInvitationRequest:
      type: object
      required: [organization_id]
      properties:
        organization_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          description: Must belong to the same organization.
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, manager, participant]
          default: participant
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 14
    CreatedInvitation:
      type: object
      required: [id, organization_id, role, expires_at, token]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [admin, manager, participant]
        expires_at:
          type: string
          format: date-time
        token:
          type: string
          description: |
            Raw token, returned only once at creation. Only its SHA-256 digest is
            stored, so it cannot be retrieved again.
    InvitationPreview:
      type: object
      required: [organization_id, organization_name, role, expires_at]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        program_id:
          type: string
          format: uuid
          nullable: true
        program_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [admin, manager, participant]
        expires_at:
          type: string
          format: date-time
    Taxonomy:
      type: object
      required: [key, name, terms]
      properties:
        key:
          type: string
          enum: [roles, experience_levels, organization_structures, organization_goals]
        name:
          type: string
        terms:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyTerm"
    TaxonomyTerm:
      type: object
      required: [id, key, label, is_other]
      properties:
        id:
          type: string
          format: uuid
          description: Stable across environments; safe to persist and cache.
        key:
          type: string
        label:
          type: string
        is_other:
          type: boolean
          description: When true, the client must collect matching free text.
    Notification:
      type: object
      required: [id, event_key, title, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_key:
          type: string
        title:
          type: string
        body:
          type: string
        path:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
        project_id:
          type: string
          format: uuid
          nullable: true
    NotificationPreference:
      type: object
      required: [id, label, description, tier, can_disable, email_enabled]
      properties:
        id:
          type: string
          enum: [account, project_activity, reminders]
        label:
          type: string
        description:
          type: string
        tier:
          type: string
          enum: [mandatory, realtime_config, digest_config]
        can_disable:
          type: boolean
        email_enabled:
          type: boolean
        digest_cadence:
          type: string
          nullable: true
          enum: [realtime, daily, weekly, off]
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing or unverifiable Firebase ID token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: |
        Access denied. `error.code` is `account_suspended` for a suspended
        account, otherwise `forbidden`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidInvitation:
      description: Invitation is invalid, expired, or already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks for the active workspace assignee
      tags: [Tasks]
      responses:
        "200":
          description: Task list
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Task detail with submissions and latest AI review
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task detail
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{task_id}/submissions:
    post:
      operationId: createTaskSubmission
      summary: Submit or resubmit task evidence (may auto-enqueue AI review)
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Submission created
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/tasks/{task_id}/creator_review:
    post:
      operationId: createCreatorReview
      summary: Creator approve or request corrections on a team task submission
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, corrections_requested]
                feedback:
                  type: string
      responses:
        "200":
          description: Task updated with creator decision
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/inbox/items:
    get:
      operationId: listInboxItems
      summary: List workspace Inbox Approvals items
      tags: [Inbox]
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [task_review, application, invitation, alert]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Inbox items for the active workspace
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/inbox/items/{id}:
    get:
      operationId: getInboxItem
      summary: Get a single Inbox item by composite id
      tags: [Inbox]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Composite id such as task_review:uuid
      responses:
        "200":
          description: Inbox item
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{task_id}/ai_reviews:
    post:
      operationId: createTaskAiReview
      summary: Explicitly request or retry solo AI review
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Review accepted
        "429":
          description: Rate limited or cooldown
        "503":
          description: AI unavailable
  /api/v1/ai/reviews/{id}:
    get:
      operationId: getAiReview
      summary: Poll AI review status
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Review payload
  /api/v1/ai/reviews/{id}/reports:
    post:
      operationId: createAiReviewReport
      summary: Report inaccurate or inappropriate AI feedback (does not reverse decision)
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Report created
  /api/v1/direct_uploads:
    post:
      operationId: createDirectUpload
      summary: Create Active Storage direct upload for submission evidence
      tags: [Tasks]
      responses:
        "201":
          description: Direct upload instructions
  /api/v1/organizations/{organization_id}/reports:
    get:
      operationId: listOrganizationReports
      summary: List organization report snapshots
      description: Staff only. Date of birth is never included.
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Report snapshots
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrganizationReport
      summary: Create a report snapshot (does not consume credits)
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_starts_on, period_ends_on, format]
              properties:
                period_starts_on: { type: string, format: date }
                period_ends_on: { type: string, format: date }
                program_id: { type: string, format: uuid, nullable: true }
                format: { type: string, enum: [pdf, csv] }
                aggregate_only: { type: boolean }
      responses:
        "201":
          description: Draft snapshot created
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organizations/{organization_id}/outcome_aggregates:
    get:
      operationId: listOrganizationOutcomeAggregates
      summary: Aggregated self-reported outcome counts for Reports
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: program_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Labeled self-reported counts
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organization_reports/{id}:
    get:
      operationId: getOrganizationReport
      summary: Show a report snapshot (poll while generating)
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Snapshot
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organization_reports/{id}/generate:
    post:
      operationId: generateOrganizationReport
      summary: Generate PDF or CSV asynchronously
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Generating or ready
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/organization_reports/{id}/download:
    post:
      operationId: downloadOrganizationReport
      summary: Issue a 15-minute signed download URL
      description: |
        Requires `confirm_minor_names=true` when the snapshot includes minor names.
        Unauthenticated requests are rejected. Date of birth is never in the file.
      tags: [Organizations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_minor_names: { type: boolean }
      responses:
        "200":
          description: Signed URL and expiry
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/outcomes:
    get:
      operationId: listOwnOutcomes
      summary: List the caller's self-reported outcomes
      tags: [Organizations]
      responses:
        "200":
          description: Own outcomes
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createOwnOutcome
      summary: Record a self-reported outcome for the active Organization workspace
      description: Always stored as the caller. `user_id` in the body is ignored. Personal-only actors receive 403.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome_type, month, year, careerstack_contribution]
              properties:
                outcome_type:
                  type: string
                  enum:
                    - interview
                    - internship
                    - freelance_opportunity
                    - job
                    - promotion
                    - college_acceptance
                    - training_or_certification_acceptance
                    - other_post_secondary_acceptance
                month: { type: integer, minimum: 1, maximum: 12 }
                year: { type: integer }
                careerstack_contribution: { type: string, enum: [yes, partially, not_sure] }
                institution: { type: string }
                title: { type: string }
                note: { type: string }
                program_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
      responses:
        "201":
          description: Outcome created
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
security:
  - bearerAuth: []
