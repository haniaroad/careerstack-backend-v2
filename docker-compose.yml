services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerstack_backend_v2_development
    ports:
      # Host 55432 avoids local Postgres commonly bound on 5432/5433.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: local-compose-secret-key-base-change-me-not-for-prod
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/careerstack_backend_v2_development
      QUEUE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/careerstack_backend_v2_development_queue
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      SENTRY_DSN: ""
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_AUTH_STUB: ${FIREBASE_AUTH_STUB:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PERSONAL_PACK_PRICE_ID: ${STRIPE_PERSONAL_PACK_PRICE_ID:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:5173/billing/return?status=success&session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:5173/billing/return?status=cancelled}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_KILL_SWITCH: ${AI_KILL_SWITCH:-false}
      AI_BUDGET_STOP: ${AI_BUDGET_STOP:-false}
      AI_INLINE_JOBS: ${AI_INLINE_JOBS:-true}
      REPORTS_INLINE_JOBS: ${REPORTS_INLINE_JOBS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Reserved for the frontend Compose service (careerstack-frontend-v2).
  web:
    profiles: ["frontend"]
    image: alpine:3.20
    command: ["true"]

volumes:
  postgres_data:
